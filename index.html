<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub Pinheiro - Cupons</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #ffffff;
            --text-dim: #8b949e;
            --green: #238636;
            --blue: #58a6ff;
            --border: #30363d;
            --purple: #8957e5;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start;
            margin-bottom: 30px; 
        }

        .sub-header { color: var(--text-dim); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px; }
        h1 { font-size: 2.2rem; margin: 5px 0 10px 0; font-weight: 800; }

        .status-badges { display: flex; gap: 10px; }
        .badge {
            background: #21262d;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border);
        }

        .dot { height: 10px; width: 10px; border-radius: 50%; background-color: var(--green); box-shadow: 0 0 10px var(--green); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .btn-export {
            background: var(--green);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Soma Geral */
        .total-geral-container {
            background: linear-gradient(145deg, #1e1b4b, #0d1117);
            padding: 25px;
            border-radius: 15px;
            border: 1px solid var(--purple);
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            text-align: center;
        }
        .total-item h3 { color: var(--text-dim); font-size: 0.75rem; text-transform: uppercase; margin-bottom: 10px; }
        .total-item p { font-size: 1.8rem; font-weight: 800; color: var(--purple); margin: 0; }

        /* Grid de Meses */
        .month-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .month-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .month-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--blue);
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }
        .data-label { color: var(--text-dim); }
        .data-value { font-weight: 600; }

        .invest-box {
            margin-top: auto;
            padding: 12px;
            background: #0d1117;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #23863644;
        }
        .invest-label { font-size: 0.65rem; color: var(--text-dim); display: block; margin-bottom: 2px; text-transform: uppercase; }
        .invest-value { font-size: 1.3rem; font-weight: 800; color: #3fb950; }

        @media (max-width: 1100px) { .month-grid, .total-geral-container { grid-template-columns: repeat(2, 1fr); gap: 15px; } }
        @media (max-width: 600px) { .month-grid, .total-geral-container { grid-template-columns: 1fr; } }
    </style>
</head>
