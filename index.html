<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA PINHEIRO | CUPONS</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-body: #0a0a0c; --card-bg: #1c1c1e; --pinheiro-blue: #bb86fc; --pinheiro-green: #03dac6; --text-main: #ffffff; --text-dim: #a1a1aa; --border: rgba(255, 255, 255, 0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); padding: 30px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px; }
        .title-group h1 { font-size: 26px; font-weight: 800; text-transform: uppercase; }
        .status-pill { background: var(--card-bg); padding: 8px 16px; border-radius: 50px; font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); margin-top: 10px; width: fit-content; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pinheiro-green); box-shadow: 0 0 10px var(--pinheiro-green); }
        .metrics-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 30px; }
        .card-kpi { background: var(--card-bg); padding: 25px; border-radius: 24px; border: 1px solid var(--border); border-top: 4px solid var(--pinheiro-blue); }
        .card-top3 { background: var(--card-bg); padding: 25px; border-radius: 24px; border: 1px solid var(--border); border-top: 4px solid var(--pinheiro-green); }
        .kpi-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; font-weight: 700; }
        .kpi-value { font-size: 24px; font-weight: 800; margin-top: 8px; display: block; }
        .months-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .month-card { background: var(--card-bg); border-radius: 20px; padding: 20px; border: 1px solid var(--border); transition: 0.3s; }
        .month-card:hover { border-color: var(--pinheiro-blue); transform: translateY(-5px); }
        .month-card h3 { font-size: 14px; color: var(--pinheiro-blue); margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .m-data { font-size: 13px; margin-bottom: 5px; display: flex; justify-content: space-between; }
        .m-data span:last-child { font-weight: bold; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="title-group">
                <h1>Painel de Cupons de Desconto</h1>
                <div class="status-pill"><div class="dot"></div> Sincronizado</div>
            </div>
            <img src="https://raw.githubusercontent.com/CamilaDS13/imagens/Principal/logobranca.png" style="height: 35px;">
        </header>

        <div class="metrics-grid">
            <div class="card-kpi">
                <span class="kpi-label">Consolidado Anual</span>
                <div style="display:flex; gap:30px; margin-top:15px">
                    <div><p class="kpi-label">Vendas</p><span id="totalVendas" class="kpi-value">R$ 0,00</span></div>
                    <div><p class="kpi-label">Compras</p><span id="totalCompras" class="kpi-value">0</span></div>
                    <div><p class="kpi-label">Descontos</p><span id="totalDesconto" class="kpi-value">R$ 0,00</span></div>
                </div>
            </div>
            <div class="card-top3">
                <span class="kpi-label">Top 3 Meses (Volume)</span>
                <div id="top3-list" style="margin-top:10px; font-size:13px"></div>
            </div>
        </div>

        <div class="months-container" id="grid-meses"></div>
    </div>

    <script>
        const URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQhPDzwfLH9O3OAunJRmHiich08Q-rpQaoIn1607LY2MG1dBmBxFArnI3QYr6WMY2wy00D1TPHbMGLm/pub?output=csv";
        async function load() {
            const r = await fetch(URL + "&t=" + new Date().getTime());
            const t = await r.text();
            const rows = t.split('\n').map(l => l.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/^"|"$/g, '').trim()));
            const data = rows.slice(1).map(r => ({
                mes: r[0].toUpperCase(),
                compras: parseInt(r[1]) || 0,
                valor: parseFloat(r[2].replace(/\./g, '').replace(',', '.')) || 0,
                desconto: parseFloat(r[3].replace(/\./g, '').replace(',', '.')) || 0
            })).filter(i => i.compras > 0);

            const sumV = data.reduce((a,b)=>a+b.valor,0);
            const sumD = data.reduce((a,b)=>a+b.desconto,0);
            document.getElementById('totalVendas').innerText = sumV.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
            document.getElementById('totalCompras').innerText = data.reduce((a,b)=>a+b.compras,0);
            document.getElementById('totalDesconto').innerText = sumD.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

            const top3 = [...data].sort((a,b)=>b.compras - a.compras).slice(0,3);
            document.getElementById('top3-list').innerHTML = top3.map((m,i)=>`<div>${i+1}º <strong>${m.mes}</strong> - ${m.compras} itens</div>`).join('');

            document.getElementById('grid-meses').innerHTML = data.map(m => `
                <div class="month-card">
                    <h3>${m.mes}</h3>
                    <div class="m-data"><span>Compras:</span><span>${m.compras}</span></div>
                    <div class="m-data"><span>Valor:</span><span>R$ ${m.valor.toLocaleString('pt-BR')}</span></div>
                    <div class="m-data"><span>Desconto:</span><span>R$ ${m.desconto.toLocaleString('pt-BR')}</span></div>
                    <div class="m-data"><span>Incentivo:</span><span style="color:var(--pinheiro-green)">${((m.desconto/m.valor)*100).toFixed(2)}%</span></div>
                </div>
            `).join('');
        }
        window.onload = load;
    </script>
</body>
</html>
