<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Cupons de Desconto - Real Time</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; color: #e0e0e0; padding: 30px; margin: 0; }
        .dashboard-wrapper { max-width: 1200px; margin: 0 auto; }
        .top-section { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 20px; }
        .months-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .card { background: #1e1e1e; border-radius: 12px; padding: 20px; border-top: 4px solid #333; box-sizing: border-box; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .consolidado { border-top: 4px solid #bb86fc; }
        .top3 { border-top: 4px solid #03dac6; }
        h1 { text-align: center; color: #fff; margin-bottom: 30px; font-weight: 800; }
        h2 { margin-top: 0; color: #bb86fc; font-size: 1.1em; letter-spacing: 1px; text-transform: uppercase; }
        .top3 h2 { color: #03dac6; }
        p { margin: 8px 0; color: #b0b0b0; font-size: 0.95em; }
        .value { font-weight: bold; color: #ffffff; }
        ol { margin: 8px 0 0 20px; padding: 0; color: #b0b0b0; }
        li { margin-bottom: 5px; }
        .btn-container { text-align: center; margin-bottom: 30px; display: flex; justify-content: center; gap: 15px; align-items: center; }
        button { background-color: #2ecc71; color: #ffffff; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1em; }
        .status-sync { font-size: 13px; color: #03dac6; font-weight: bold; }
        
        /* Cores para o Incentivo % */
        .incentivo-val { color: #bb86fc; font-weight: bold; }
    </style>
</head>
<body>
    <div class="dashboard-wrapper">
        <h1>Painel de Cupons de Desconto</h1>
        
        <div class="btn-container">
            <span id="statusLabel" class="status-sync">Sincronizando com Google Sheets...</span>
            <button onclick="exportToExcel()">Exportar para Excel (CSV)</button>
        </div>
        
        <div class="top-section">
            <!-- CONSOLIDADO ANUAL -->
            <div class="card consolidado">
                <h2>CONSOLIDADO ANUAL</h2>
                <p>Meses com Dados: <span id="totalMeses" class="value">0</span> | Compras Total: <span id="totalCompras" class="value">0</span></p>
                <p>Valor Total: <span id="totalValor" class="value">R$ 0,00</span> | Desconto Total: <span id="totalDesconto" class="value">R$ 0,00</span></p>
            </div>

            <!-- TOP 3 MESES -->
            <div class="card top3">
                <h2>TOP 3 MESES (MAIORES COMPRAS)</h2>
                <ol id="top3List">
                    <li>Aguardando dados...</li>
                </ol>
            </div>
        </div>

        <!-- CONTAINER DOS MESES -->
        <div class="months-container" id="mesesGrid">
            <!-- Os cards dos meses serão gerados automaticamente aqui -->
        </div>
    </div>

    <script>
        // LINK DA PLANILHA DE CUPONS (CSV PUBLICADO)
        const URL_CUPONS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQhPDzwfLH9O3OAunJRmHiich08Q-rpQaoIn1607LY2MG1dBmBxFArnI3QYr6WMY2wy00D1TPHbMGLm/pub?output=csv";

        let dadosTratados = [];

        async function carregarDados() {
            try {
                const response = await fetch(URL_CUPONS + "&t=" + new Date().getTime());
                const csvText = await response.text();
                const rows = csvText.split('\n').map(row => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/));

                if (rows.length > 1) {
                    processarDados(rows);
                    document.getElementById('statusLabel').innerText = "✅ Sincronizado com Sucesso";
                }
            } catch (err) {
                document.getElementById('statusLabel').innerText = "❌ Erro na conexão.";
                console.error(err);
            }
        }

        function limparMoeda(v) {
            if (!v) return 0;
            let n = v.toString().replace(/"/g, '').replace(/R\$/g, '').replace(/\s/g, '').replace(/\./g, '').replace(',', '.');
            return parseFloat(n) || 0;
        }

        function processarDados(rows) {
            // Mapeamento: 0:Mês, 1:Compras, 2:Valor, 3:Desconto
            dadosTratados = rows.slice(1).map(row => {
                if(!row[0] || row[0].trim() === "" || row[0].toLowerCase().includes("mes")) return null;

                const compras = parseInt(row[1]) || 0;
                const valor = limparMoeda(row[2]);
                const desconto = limparMoeda(row[3]);
                // Cálculo automático do incentivo
                const incentivo = valor > 0 ? (desconto / valor) * 100 : 0;

                return {
                    mes: row[0].replace(/"/g, '').trim().toUpperCase(),
                    compras: compras,
                    valor: valor,
                    desconto: desconto,
                    incentivo: incentivo.toFixed(2) + "%"
                };
            }).filter(i => i !== null);

            renderizarDashboard();
        }

        function renderizarDashboard() {
            const grid = document.getElementById('mesesGrid');
            const top3List = document.getElementById('top3List');
            grid.innerHTML = "";
            
            let sumCompras = 0;
            let sumValor = 0;
            let sumDesconto = 0;

            // Criar Cards dos Meses
            dadosTratados.forEach(d => {
                sumCompras += d.compras;
                sumValor += d.valor;
                sumDesconto += d.desconto;

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h2>${d.mes}</h2>
                    <p>Compras: <span class="value">${d.compras.toLocaleString('pt-BR')}</span></p>
                    <p>Valor: <span class="value">R$ ${d.valor.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</span></p>
                    <p>Desconto: <span class="value">R$ ${d.desconto.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</span></p>
                    <p>Incentivo: <span class="incentivo-val">${d.incentivo}</span></p>
                `;
                grid.appendChild(card);
            });

            // Atualizar Consolidado
            document.getElementById('totalMeses').innerText = dadosTratados.length;
            document.getElementById('totalCompras').innerText = sumCompras.toLocaleString('pt-BR');
            document.getElementById('totalValor').innerText = sumValor.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
            document.getElementById('totalDesconto').innerText = sumDesconto.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});

            // Calcular Top 3
            const top3 = [...dadosTratados].sort((a, b) => b.compras - a.compras).slice(0, 3);
            top3List.innerHTML = top3.map((m, i) => `
                <li><span class="value">${m.mes}</span>: ${m.compras} compras (R$ ${m.valor.toLocaleString('pt-BR', {minimumFractionDigits:2})})</li>
            `).join('');
        }

        function exportToExcel() {
            let csv = "\uFEFFMês;Compras;Valor;Desconto;Incentivo\n";
            dadosTratados.forEach(d => {
                csv += `${d.mes};${d.compras};${d.valor};${d.desconto};${d.incentivo}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "relatorio_cupons_2026.csv";
            link.click();
        }

        window.onload = carregarDados;
    </script>
</body>
</html>
