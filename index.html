<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub Pinheiro - Cupons</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #ffffff;
            --text-dim: #8b949e;
            --green: #238636;
            --blue: #58a6ff;
            --border: #30363d;
            --purple: #8957e5;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start;
            margin-bottom: 30px; 
        }

        .sub-header { color: var(--text-dim); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px; }
        h1 { font-size: 2.2rem; margin: 5px 0 10px 0; font-weight: 800; }

        .status-badges { display: flex; gap: 10px; }
        .badge {
            background: #21262d;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border);
        }

        .dot { height: 10px; width: 10px; border-radius: 50%; background-color: var(--green); box-shadow: 0 0 10px var(--green); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .btn-export {
            background: var(--green);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Soma Geral */
        .total-geral-container {
            background: linear-gradient(145deg, #1e1b4b, #0d1117);
            padding: 25px;
            border-radius: 15px;
            border: 1px solid var(--purple);
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            text-align: center;
        }
        .total-item h3 { color: var(--text-dim); font-size: 0.75rem; text-transform: uppercase; margin-bottom: 10px; }
        .total-item p { font-size: 1.8rem; font-weight: 800; color: var(--purple); margin: 0; }

        /* Grid de Meses */
        .month-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .month-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 220px;
        }

        .month-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--blue);
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }
        .data-label { color: var(--text-dim); }
        .data-value { font-weight: 600; }

        .invest-box {
            margin-top: auto;
            padding: 12px;
            background: #0d1117;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #23863644;
        }
        .invest-label { font-size: 0.65rem; color: var(--text-dim); display: block; margin-bottom: 2px; text-transform: uppercase; }
        .invest-value { font-size: 1.3rem; font-weight: 800; color: #3fb950; }

        @media (max-width: 1100px) { .month-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .month-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div>
                <div class="sub-header">Central de Inteligência Operacional</div>
                <h1>ANÁLISE DE CUPONS APLICADOS</h1>
                <div class="status-badges">
                    <div class="badge"><span class="dot"></span> Sistema Online</div>
                    <div id="sync-badge" class="badge"><i class="fas fa-sync fa-spin"></i> Sincronizando...</div>
                </div>
            </div>
            <button class="btn-export" onclick="exportExcel()">
                <i class="fas fa-file-excel"></i> Exportar Excel
            </button>
        </header>

        <div class="total-geral-container" id="total-geral">
            <div class="total-item">
                <h3>Qtd Total Compras</h3>
                <p id="total-qtd">0</p>
            </div>
            <div class="total-item">
                <h3>Valor Total Vendas</h3>
                <p id="total-valor">R$ 0,00</p>
            </div>
            <div class="total-item">
                <h3>Total Descontos</h3>
                <p id="total-desconto">R$ 0,00</p>
            </div>
            <div class="total-item">
                <h3>Investimento Médio</h3>
                <p id="total-invest">0%</p>
            </div>
        </div>

        <div class="month-grid" id="month-grid"></div>
    </div>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQhPDzwfLH9O3OAunJRmHiich08Q-rpQaoIn1607LY2MG1dBmBxFArnI3QYr6WMY2wy00D1TPHbMGLm/pub?output=csv';
        const mesesNomes = ["JANEIRO", "FEVEREIRO", "MARÇO", "ABRIL", "MAIO", "JUNHO", "JULHO", "AGOSTO", "SETEMBRO", "OUTUBRO", "NOVEMBRO", "DEZEMBRO"];
        let dadosGlobais = {};

        // Função para limpar números (converte "4.628,58" para 4628.58)
        function parseNum(valor) {
            if (!valor) return 0;
            if (typeof valor === 'number') return valor;
            // Remove R$, tira o ponto de milhar e troca vírgula decimal por ponto
            let limpo = valor.toString().replace(/R\$/g, '').replace(/\./g, '').replace(',', '.').trim();
            return parseFloat(limpo) || 0;
        }

        async function fetchData() {
            Papa.parse(SHEET_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    processarDados(results.data);
                }
            });
        }

        function processarDados(data) {
            const meses = {};
            mesesNomes.forEach(m => meses[m] = { qtd: 0, valor: 0, desconto: 0 });

            let gQtd = 0, gValor = 0, gDesconto = 0;

            data.forEach(row => {
                // Pega o nome do mês da coluna "MES"
                const mesPlanilha = row['MES'] ? row['MES'].toString().toUpperCase().trim() : null;
                
                if (mesPlanilha && meses[mesPlanilha]) {
                    const q = parseNum(row['QTD DE COMPRAS']);
                    const v = parseNum(row['VALOR DA VENDA']);
                    const d = parseNum(row['DESCONTO']);

                    meses[mesPlanilha].qtd += q;
                    meses[mesPlanilha].valor += v;
                    meses[mesPlanilha].desconto += d;

                    gQtd += q;
                    gValor += v;
                    gDesconto += d;
                }
            });

            dadosGlobais = meses;
            atualizarInterface(meses, gQtd, gValor, gDesconto);
            document.getElementById('sync-badge').innerHTML = `<i class="far fa-clock"></i> Atualizado: ${new Date().toLocaleTimeString()}`;
        }

        function atualizarInterface(meses, q, v, d) {
            // Topo
            document.getElementById('total-qtd').innerText = q.toLocaleString('pt-BR');
            document.getElementById('total-valor').innerText = v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            document.getElementById('total-desconto').innerText = d.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            document.getElementById('total-invest').innerText = (v > 0 ? ((d / v) * 100).toFixed(2) : 0) + '%';

            // Cards
            const grid = document.getElementById('month-grid');
            grid.innerHTML = '';
            mesesNomes.forEach(nome => {
                const m = meses[nome];
                const invest = m.valor > 0 ? ((m.desconto / m.valor) * 100).toFixed(2) : "0.00";

                grid.innerHTML += `
                    <div class="month-card">
                        <div class="month-name">
                            ${nome}
                            <i class="fas fa-ticket-alt" style="font-size: 0.8rem; opacity: 0.3;"></i>
                        </div>
                        <div class="data-row">
                            <span class="data-label">Qtd de Compra</span>
                            <span class="data-value">${m.qtd.toLocaleString('pt-BR')}</span>
                        </div>
                        <div class="data-row">
                            <span class="data-label">Valor da Venda</span>
                            <span class="data-value">${m.valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</span>
                        </div>
                        <div class="data-row">
                            <span class="data-label">Desconto</span>
                            <span class="data-value">${m.desconto.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</span>
                        </div>
                        <div class="invest-box">
                            <span class="invest-label">% Investimento</span>
                            <span class="invest-value">${invest}%</span>
                        </div>
                    </div>
                `;
            });
        }

        function exportExcel() {
            const exportArr = mesesNomes.map(m => ({
                Mês: m,
                'Qtd Compras': dadosGlobais[m].qtd,
                'Valor Venda': dadosGlobais[m].valor,
                'Desconto': dadosGlobais[m].desconto,
                '% Investimento': dadosGlobais[m].valor > 0 ? ((dadosGlobais[m].desconto / dadosGlobais[m].valor) * 100).toFixed(2) + '%' : '0%'
            }));
            const ws = XLSX.utils.json_to_sheet(exportArr);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Cupons");
            XLSX.writeFile(wb, "Relatorio_Cupons_Pinheiro.xlsx");
        }

        fetchData();
        setInterval(fetchData, 60000);
    </script>
</body>
</html>
